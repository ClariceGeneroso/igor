{% extends 'base.html' %}

{% block title %}Criar Conta - Séries{% endblock %}

{% block content %}
<h2>Criar Nova Conta</h2>
<form method="POST" action="{{ url_for('auth.register') }}">
    <div class="form-group">
        <label for="username">Usuário</label>
        <input type="text" id="username" name="username" class="form-control" required autocomplete="off">
    </div>

    <div class="form-group">
        <label for="password">Senha</label>
        <input type="password" id="password" name="password" class="form-control" required>
    </div>

    <button type="submit" class="btn">Cadastrar</button>
</form>

<p style="margin-top: 1rem; text-align: center; font-size: 0.9rem;">
    Já possui uma conta? <a href="{{ url_for('auth.login') }}">Faça login</a>
</p>
{% endblock %}
